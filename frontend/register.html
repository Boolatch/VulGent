<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VulGent — Register</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <main class="container">
    <section class="card">
      <span class="badge">Testing Frontend</span>
      <h1>Create an Account</h1>
      <p class="subtitle">Register a new user in Supabase Auth and <code>public.users</code>.</p>

      <form id="register-form">
        <div class="grid">
          <div class="field">
            <label for="f_name">First Name</label>
            <input type="text" id="f_name" name="f_name" required />
          </div>

          <div class="field">
            <label for="l_name">Last Name</label>
            <input type="text" id="l_name" name="l_name" required />
          </div>

          <div class="field full">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required />
          </div>

          <div class="field full">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" minlength="6" required />
          </div>

          <div class="field">
            <label for="phone_number">Phone Number</label>
            <input type="tel" id="phone_number" name="phone_number" required />
          </div>

          <div class="field">
            <label for="birth_date">Birth Date</label>
            <input type="date" id="birth_date" name="birth_date" required />
          </div>

          <div class="field full">
            <label for="home_address">Home Address</label>
            <input type="text" id="home_address" name="home_address" required />
          </div>
        </div>

        <div class="checkbox-row">
          <input type="checkbox" id="create_company" name="create_company" />
          <label for="create_company">Create company</label>
        </div>

        <button type="submit" id="submit-btn">Register</button>
      </form>

      <div id="status-box" class="status" role="status" aria-live="polite"></div>
    </section>
  </main>

  <script>
    const form = document.getElementById("register-form");
    const submitBtn = document.getElementById("submit-btn");
    const statusBox = document.getElementById("status-box");

    function showStatus(type, message, payload) {
      statusBox.className = `status visible ${type}`;
      statusBox.innerHTML = "";

      const msg = document.createElement("div");
      msg.textContent = message;
      statusBox.appendChild(msg);

      if (payload !== undefined) {
        const pre = document.createElement("pre");
        pre.textContent = JSON.stringify(payload, null, 2);
        statusBox.appendChild(pre);
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      submitBtn.disabled = true;
      submitBtn.textContent = "Registering...";
      statusBox.className = "status";

      try {
        const formData = new FormData(form);
        const wantsCompany = document.getElementById("create_company").checked;
        formData.set("create_company", wantsCompany ? "true" : "false");

        const response = await fetch("/auth/register", {
          method: "POST",
          body: formData,
        });
        const data = await response.json();

        if (!response.ok) {
          showStatus("error", data.detail || "Registration failed.", data);
          return;
        }

        if (wantsCompany && data.user_id) {
          sessionStorage.setItem("pending_company_owner_id", data.user_id);
          sessionStorage.setItem("pending_company_owner_email", data.email || "");
          const params = new URLSearchParams({
            owner_id: data.user_id,
            email: data.email || "",
          });
          window.location.href = `/create-company?${params.toString()}`;
          return;
        }

        showStatus("success", data.message || "Registered successfully.", data);
        form.reset();
      } catch (err) {
        showStatus("error", `Network error: ${err.message}`);
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Register";
      }
    });
  </script>
</body>
</html>
